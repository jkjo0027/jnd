<svg xmlns="http://www.w3.org/2000/svg" width="480" height="724" viewBox="0 0 480 724" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">빠른 방문과 깔끔한 시공 감사합니다.</title><desc id="desc">가게 오픈을 앞두고 자동문 설치가 필요해서 연락드렸는데 일정도 잘 맞춰주시고 빠르게 진행해 주셨습니다. 작업하시는 동안에도 주변 정리를 깔끔하게 해주셔서 좋았어요. 설치 후 작동 방법과 주의사항도 자세히 알려주셨고 여러 번 테스트까지 해주셨습니다. 덕분에 오픈 준비 잘 마무리했습니다.</desc>
<rect width="480" height="724" fill="#ffffff"/>
<path d="M0 0H480V8H0Z" fill="#fed91b"/>
<rect x="32" y="32" width="88" height="30" rx="15" fill="#fff4ba"/>
<text x="76" y="53" text-anchor="middle" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" font-weight="700" fill="#514000">후기 02</text>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#171d26"><tspan x="32" y="108">빠른 방문과 깔끔한 시공</tspan><tspan x="32" y="148">감사합니다.</tspan></text>
<text x="32" y="203" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#65717f">빠른 일정 및 매장 설치</text>
<path d="M32 230H448" stroke="#e8ebef"/>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" fill="#303b49"><tspan x="32" y="280">가게 오픈을 앞두고 자동문 설치가</tspan><tspan x="32" y="316">필요해서 연락드렸는데 일정도 잘</tspan><tspan x="32" y="352">맞춰주시고 빠르게 진행해 주셨습니다.</tspan><tspan x="32" y="388">작업하시는 동안에도 주변 정리를</tspan><tspan x="32" y="424">깔끔하게 해주셔서 좋았어요. 설치 후</tspan><tspan x="32" y="460">작동 방법과 주의사항도 자세히</tspan><tspan x="32" y="496">알려주셨고 여러 번 테스트까지</tspan><tspan x="32" y="532">해주셨습니다. 덕분에 오픈 준비 잘</tspan><tspan x="32" y="568">마무리했습니다.</tspan></text>
<text x="32" y="694" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7b8490">J&amp;D SYSTEM</text>
</svg>