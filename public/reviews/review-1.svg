<svg xmlns="http://www.w3.org/2000/svg" width="480" height="724" viewBox="0 0 480 724" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">설치부터 마무리까지 만족스러웠어요!</title><desc id="desc">매장 출입문을 자동문으로 교체하려고 알아보다가 문의드렸습니다. 상담할 때부터 친절하게 설명해 주셨고, 현장에 오셔서 설치할 위치와 필요한 부분도 꼼꼼하게 확인해 주셨어요. 설치도 깔끔하게 잘해 주셨고 문이 열리고 닫히는 속도까지 세심하게 조절해 주셨습니다. 생각했던 것보다 훨씬 만족스럽네요. 감사합니다!</desc>
<rect width="480" height="724" fill="#ffffff"/>
<path d="M0 0H480V8H0Z" fill="#fed91b"/>
<rect x="32" y="32" width="88" height="30" rx="15" fill="#fff4ba"/>
<text x="76" y="53" text-anchor="middle" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" font-weight="700" fill="#514000">후기 01</text>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#171d26"><tspan x="32" y="108">설치부터 마무리까지</tspan><tspan x="32" y="148">만족스러웠어요!</tspan></text>
<text x="32" y="203" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#65717f">설치 전 상담 및 시공 만족</text>
<path d="M32 230H448" stroke="#e8ebef"/>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" fill="#303b49"><tspan x="32" y="280">매장 출입문을 자동문으로 교체하려고</tspan><tspan x="32" y="316">알아보다가 문의드렸습니다. 상담할</tspan><tspan x="32" y="352">때부터 친절하게 설명해 주셨고,</tspan><tspan x="32" y="388">현장에 오셔서 설치할 위치와 필요한</tspan><tspan x="32" y="424">부분도 꼼꼼하게 확인해 주셨어요.</tspan><tspan x="32" y="460">설치도 깔끔하게 잘해 주셨고 문이</tspan><tspan x="32" y="496">열리고 닫히는 속도까지 세심하게</tspan><tspan x="32" y="532">조절해 주셨습니다. 생각했던 것보다</tspan><tspan x="32" y="568">훨씬 만족스럽네요. 감사합니다!</tspan></text>
<text x="32" y="694" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7b8490">J&amp;D SYSTEM</text>
</svg>