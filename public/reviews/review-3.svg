<svg xmlns="http://www.w3.org/2000/svg" width="480" height="724" viewBox="0 0 480 724" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">오래된 자동문 교체하길 잘했네요.</title><desc id="desc">기존 자동문이 오래되어서 작동도 불안정하고 소음도 심했는데 이번에 새 제품으로 교체했습니다. 처음에는 수리만 할까 고민했지만 현장 확인 후 자세하게 설명해 주셔서 교체를 결정했어요. 설치하고 나니 문 움직임도 부드럽고 소음도 줄어들어 만족스럽습니다. 처음부터 마무리까지 책임감 있게 작업해 주셔서 믿음이 갔습니다.</desc>
<rect width="480" height="724" fill="#ffffff"/>
<path d="M0 0H480V8H0Z" fill="#fed91b"/>
<rect x="32" y="32" width="88" height="30" rx="15" fill="#fff4ba"/>
<text x="76" y="53" text-anchor="middle" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" font-weight="700" fill="#514000">후기 03</text>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#171d26"><tspan x="32" y="108">오래된 자동문 교체하길</tspan><tspan x="32" y="148">잘했네요.</tspan></text>
<text x="32" y="203" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#65717f">노후 자동문 교체</text>
<path d="M32 230H448" stroke="#e8ebef"/>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" fill="#303b49"><tspan x="32" y="280">기존 자동문이 오래되어서 작동도</tspan><tspan x="32" y="316">불안정하고 소음도 심했는데 이번에 새</tspan><tspan x="32" y="352">제품으로 교체했습니다. 처음에는</tspan><tspan x="32" y="388">수리만 할까 고민했지만 현장 확인 후</tspan><tspan x="32" y="424">자세하게 설명해 주셔서 교체를</tspan><tspan x="32" y="460">결정했어요. 설치하고 나니 문</tspan><tspan x="32" y="496">움직임도 부드럽고 소음도 줄어들어</tspan><tspan x="32" y="532">만족스럽습니다. 처음부터 마무리까지</tspan><tspan x="32" y="568">책임감 있게 작업해 주셔서 믿음이</tspan><tspan x="32" y="604">갔습니다.</tspan></text>
<text x="32" y="694" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7b8490">J&amp;D SYSTEM</text>
</svg>