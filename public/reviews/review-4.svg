<svg xmlns="http://www.w3.org/2000/svg" width="480" height="724" viewBox="0 0 480 724" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">꼼꼼하게 설치해 주셔서 좋았습니다.</title><desc id="desc">건물 출입구에 자동문을 새로 설치하게 되어 여러 업체를 알아보다가 상담 후 진행했습니다. 현장 상황에 맞게 설치 방향과 작동 방식도 안내해 주셨고, 센서 위치도 적절하게 잡아주셨어요. 설치가 끝난 후에도 실제로 사람이 출입하는 상황을 확인하면서 작동 테스트를 해주셔서 안심이 됐습니다. 전체적으로 깔끔하게 잘 설치해 주셨습니다.</desc>
<rect width="480" height="724" fill="#ffffff"/>
<path d="M0 0H480V8H0Z" fill="#fed91b"/>
<rect x="32" y="32" width="88" height="30" rx="15" fill="#fff4ba"/>
<text x="76" y="53" text-anchor="middle" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" font-weight="700" fill="#514000">후기 04</text>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#171d26"><tspan x="32" y="108">꼼꼼하게 설치해 주셔서</tspan><tspan x="32" y="148">좋았습니다.</tspan></text>
<text x="32" y="203" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#65717f">건물 출입구 신규 설치</text>
<path d="M32 230H448" stroke="#e8ebef"/>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" fill="#303b49"><tspan x="32" y="280">건물 출입구에 자동문을 새로 설치하게</tspan><tspan x="32" y="316">되어 여러 업체를 알아보다가 상담 후</tspan><tspan x="32" y="352">진행했습니다. 현장 상황에 맞게 설치</tspan><tspan x="32" y="388">방향과 작동 방식도 안내해 주셨고,</tspan><tspan x="32" y="424">센서 위치도 적절하게 잡아주셨어요.</tspan><tspan x="32" y="460">설치가 끝난 후에도 실제로 사람이</tspan><tspan x="32" y="496">출입하는 상황을 확인하면서 작동</tspan><tspan x="32" y="532">테스트를 해주셔서 안심이 됐습니다.</tspan><tspan x="32" y="568">전체적으로 깔끔하게 잘 설치해</tspan><tspan x="32" y="604">주셨습니다.</tspan></text>
<text x="32" y="694" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7b8490">J&amp;D SYSTEM</text>
</svg>