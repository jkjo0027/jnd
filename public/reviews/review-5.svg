<svg xmlns="http://www.w3.org/2000/svg" width="480" height="724" viewBox="0 0 480 724" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">다음에도 자동문 관련 작업은 여기서 할 것 같아요.</title><desc id="desc">자동문 설치가 처음이라 모르는 부분이 많았는데 문의할 때마다 친절하게 알려주셔서 좋았습니다. 제품 선택부터 설치 과정까지 어렵지 않게 설명해 주셨고, 작업도 생각보다 빠르게 끝났습니다. 설치 후 문이 정상적으로 작동하는지 여러 차례 확인해 주시고 사용하면서 알아두면 좋은 부분도 알려주셨어요. 주변에 자동문 설치가 필요한 분이 있다면 추천하고 싶습니다.</desc>
<rect width="480" height="724" fill="#ffffff"/>
<path d="M0 0H480V8H0Z" fill="#fed91b"/>
<rect x="32" y="32" width="88" height="30" rx="15" fill="#fff4ba"/>
<text x="76" y="53" text-anchor="middle" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" font-weight="700" fill="#514000">후기 05</text>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#171d26"><tspan x="32" y="108">다음에도 자동문 관련 작업은</tspan><tspan x="32" y="148">여기서 할 것 같아요.</tspan></text>
<text x="32" y="203" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#65717f">전반적인 서비스 및 재이용 의사</text>
<path d="M32 230H448" stroke="#e8ebef"/>
<text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" fill="#303b49"><tspan x="32" y="280">자동문 설치가 처음이라 모르는 부분이</tspan><tspan x="32" y="316">많았는데 문의할 때마다 친절하게</tspan><tspan x="32" y="352">알려주셔서 좋았습니다. 제품 선택부터</tspan><tspan x="32" y="388">설치 과정까지 어렵지 않게 설명해</tspan><tspan x="32" y="424">주셨고, 작업도 생각보다 빠르게</tspan><tspan x="32" y="460">끝났습니다. 설치 후 문이 정상적으로</tspan><tspan x="32" y="496">작동하는지 여러 차례 확인해 주시고</tspan><tspan x="32" y="532">사용하면서 알아두면 좋은 부분도</tspan><tspan x="32" y="568">알려주셨어요. 주변에 자동문 설치가</tspan><tspan x="32" y="604">필요한 분이 있다면 추천하고</tspan><tspan x="32" y="640">싶습니다.</tspan></text>
<text x="32" y="694" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7b8490">J&amp;D SYSTEM</text>
</svg>