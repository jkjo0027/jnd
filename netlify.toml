# Netlify 배포 설정. Next.js 는 Netlify 의 Next 런타임(@netlify/plugin-nextjs, 자동 설치)으로 동작한다.
# 콘텐츠·사진·문의 백업은 사이트 전용 Netlify Blobs에 저장한다. 로컬 var/는 개발 전용이다.
# 운영 문의는 CONTACT_MODE=live, CONTACT_NOTIFY_PROVIDER=netlify-forms와 Forms 이메일 수신 확인이 필요하다.
# netlify/functions/purge-inquiries.mjs는 공개 배포에서 정해진 문의 백업 보유기간을 적용한다.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
