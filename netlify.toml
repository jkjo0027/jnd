# Netlify 배포 설정. Next.js 는 Netlify 의 Next 런타임(@netlify/plugin-nextjs, 자동 설치)으로 동작한다.
# 주의: Netlify 는 서버리스라 var/(운영자 발행 페이지·업로드 사진·문의 백업)가 배포·인스턴스 간에 유지되지 않는다.
#       공개 사이트·관리자 로그인·미리보기는 동작하지만, 운영자 직접 발행과 사진 업로드를 운영에서 쓰려면
#       src/lib/server/content.ts·uploads.ts 를 Netlify Blobs 등 영구 저장소 어댑터로 바꿔야 한다(docs/release-and-rollback.md 3-3).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
